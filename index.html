<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>John Salisbury</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #000;
      --fg: #fff;
      --dim: rgba(255,255,255,0.3);
      --faint: rgba(255,255,255,0.09);
      --mono: 'IBM Plex Mono', 'Courier New', monospace;
      --display: 'Bebas Neue', 'Arial Narrow', sans-serif;
      color-scheme: dark;
    }

    html, body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--mono);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.6rem max(24px, env(safe-area-inset-right, 24px))
               1.6rem max(24px, env(safe-area-inset-left, 24px));
      border-bottom: 1px solid var(--faint);
    }

    .logo {
      font-size: 10px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--dim);
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--fg); }

    /* ── HERO PANEL ── */
    .hero {
      position: relative;
      width: 100%;
      /* Fixed aspect ratio — the canvas lives here */
      aspect-ratio: 16 / 7;
      background: #000;
      border-bottom: 1px solid var(--faint);
      overflow: hidden;
    }

    #heroCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* ── FOOTER STRIP ── */
    .footer-strip {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 3rem;
      padding: 0.9rem max(24px, env(safe-area-inset-left, 24px));
      border-bottom: 1px solid var(--faint);
    }

    .footer-strip-item {
      flex: none;
    }

    .strip-label {
      font-size: 7px;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--faint);
      display: block;
      margin-bottom: 0.3rem;
    }

    .strip-value {
      font-family: var(--display);
      font-size: clamp(9px, 1.1vw, 15px);
      letter-spacing: 0.06em;
      color: var(--fg);
      line-height: 1;
    }

    /* ── FOOTER ── */
    footer {
      display: flex;
      justify-content: space-between;
      padding: 1.4rem max(24px, env(safe-area-inset-right, 24px))
               1.4rem max(24px, env(safe-area-inset-left, 24px));
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    footer span {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.16);
    }

    @media (max-width: 600px) {
      .footer-strip { flex-direction: column; }
      .footer-strip-item { border-right: none; border-bottom: 1px solid var(--faint); }
      .footer-strip-item:last-child { border-bottom: none; }
      .bottom { grid-template-columns: 1fr; }
      .bottom-cell { border-right: none; border-bottom: 1px solid var(--faint); }
      .bottom-cell:last-child { border-bottom: none; }
      .hero { aspect-ratio: 4 / 3; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
</head>
<body>

  <header>
    <span class="logo">John Salisbury</span>
    <nav>
      <a href="#practice">Practice</a>
      <a href="#about">About</a>
      <a href="mailto:john.salisbury@adaptivstudios.com">Contact</a>
    </nav>
  </header>

  <!-- ── HERO: animated canvas ── -->
  <div class="hero">
    <canvas id="heroCanvas" aria-label="John Salisbury Design"></canvas>
  </div>

  <!-- ── PRACTICE STRIP ── -->
  <div class="footer-strip" id="practice">
    <div class="footer-strip-item">
      <span class="strip-label">01</span>
      <div class="strip-value">UX &amp; Product</div>
    </div>
    <div class="footer-strip-item">
      <span class="strip-label">02</span>
      <div class="strip-value">Brand &amp; Conceptual</div>
    </div>
    <div class="footer-strip-item">
      <span class="strip-label">03</span>
      <div class="strip-value">Motion &amp; Experiments</div>
    </div>
  </div>

  <footer>
    <span>© 2026 John Salisbury</span>
    <span>johnsalisburydesign.com</span>
  </footer>

<script>
;(function () {
  const canvas = document.getElementById('heroCanvas');
  const ctx = canvas.getContext('2d');

  const FACE = "'Bebas Neue', 'Arial Narrow', sans-serif";

  // Layout: two lines + "DESIGN" label
  // Letters are spaced out — readable but typographically loose,
  // like a title set with intentional tracked gaps.
  // Each letter has a fixed proportional position.

  let W, H, dpr;
  let letters = [];
  let raf;

  // --- ANIMATION STATE ---
  // We use a "posterize time" / frame-echo approach:
  // - A hidden offscreen buffer receives smooth animation
  // - We composite the buffer onto the canvas at a STEPPED rate (e.g. 12fps)
  //   using additive blending — older frames linger at low opacity
  // - This creates the AE "echo" / trace / posterize-time look
  const TRAIL_FRAMES = 6;     // how many echo frames to keep
  const STEP_FPS = 10;        // stepped frame rate (posterize time)
  let trail = [];             // circular buffer of ImageData snapshots
  let lastStep = 0;
  let globalT = 0;

  // Each letter: char, proportional x/y from center, relative size, phase offset
  // Laid out so JOHN is one row, SALISBURY below — but with generous tracking
  // and slight vertical offset variation for typographic interest.
  // DESIGN sits smaller, bottom right as a descriptor.

  // Layout: left-aligned block, anchored to a left margin.
  // lx = offset from left margin (as fraction of W), ly = offset from vertical center.
  // ls = relative size. Letters tracked wide so they spread rightward.
  // Base size reduced to ~22% of H (was 30%) so the block is more compact.
  // Left margin: 0.05W

  // All three rows same font size (ls:1.00 everywhere).
  // lx values are base positions — the kerning animation will spread/contract
  // letters horizontally from these anchors at runtime.
  // Tighter base tracking than before (~50% of previous gap).

  // All rows same size. ly values are baseline positions from canvas center.
  // Row spacing = 0.22H so three rows sit evenly centered in the panel.
  // The flipped S in SALISBURY rotates around its own baseline/center,
  // so its ly must match the rest of the row exactly.

  const LAYOUT = [
    // JOHN
    { c:'J', lx:0.000, ly:-0.22, ls:1.00, ph:0.0, flip:false },
    { c:'O', lx:0.068, ly:-0.22, ls:1.00, ph:0.3, flip:false },
    { c:'H', lx:0.148, ly:-0.22, ls:1.00, ph:0.6, flip:false },
    { c:'N', lx:0.228, ly:-0.22, ls:1.00, ph:0.9, flip:true  },
    // SALISBURY — same ly as JOHN shifted down by 0.22
    { c:'S', lx:0.000, ly: 0.00, ls:1.00, ph:1.2, flip:true  },
    { c:'A', lx:0.068, ly: 0.00, ls:1.00, ph:1.5, flip:false },
    { c:'L', lx:0.136, ly: 0.00, ls:1.00, ph:1.8, flip:false },
    { c:'I', lx:0.196, ly: 0.00, ls:1.00, ph:2.1, flip:false },
    { c:'S', lx:0.222, ly: 0.00, ls:1.00, ph:2.4, flip:false },
    { c:'B', lx:0.290, ly: 0.00, ls:1.00, ph:2.7, flip:false },
    { c:'U', lx:0.362, ly: 0.00, ls:1.00, ph:3.0, flip:false },
    { c:'R', lx:0.434, ly: 0.00, ls:1.00, ph:3.3, flip:false },
    { c:'Y', lx:0.506, ly: 0.00, ls:1.00, ph:3.6, flip:false },
    // DESIGN
    { c:'D', lx:0.000, ly: 0.22, ls:1.00, ph:4.0, flip:false },
    { c:'E', lx:0.068, ly: 0.22, ls:1.00, ph:4.1, flip:false },
    { c:'S', lx:0.136, ly: 0.22, ls:1.00, ph:4.2, flip:false },
    { c:'I', lx:0.196, ly: 0.22, ls:1.00, ph:4.3, flip:false },
    { c:'G', lx:0.222, ly: 0.22, ls:1.00, ph:4.4, flip:false },
    { c:'N', lx:0.290, ly: 0.22, ls:1.00, ph:4.5, flip:false },
  ];

  // Row letter counts — used to compute cumulative kerning offsets at render time
  // Row 0: JOHN (indices 0–3), Row 1: SALISBURY (4–12), Row 2: DESIGN (13–18)
  const ROW_STARTS = [0, 4, 13];

  function buildLetters() {
    letters = [];
    const baseSize = H * 0.20;  // uniform size for all rows
    const leftMargin = W * 0.05;

    LAYOUT.forEach(def => {
      const size = Math.round(baseSize * def.ls);
      ctx.font = `${size}px ${FACE}`;
      const m = ctx.measureText(def.c);
      const charW = m.width;
      // Use actual measured ascent so flip pivot is exact
      const ascent = m.actualBoundingBoxAscent || size * 0.78;
      letters.push({
        c: def.c,
        bx: leftMargin + def.lx * W,
        by: H / 2 + def.ly * H,
        size,
        ph: def.ph,
        flip: def.flip || false,
        charW, ascent,
        lx: def.lx, // keep for kerning calc
        row: ROW_STARTS.findIndex((s, i) =>
          s <= LAYOUT.indexOf(def) && (ROW_STARTS[i+1] === undefined || LAYOUT.indexOf(def) < ROW_STARTS[i+1])
        ),
        idxInRow: 0, // filled below
      });
    });

    // fill idxInRow
    const rowCounters = [0, 0, 0];
    letters.forEach(l => {
      l.idxInRow = rowCounters[l.row]++;
    });
  }

  function setup() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.offsetWidth;
    H = canvas.offsetHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);
    trail = [];
    buildLetters();
  }

  // Draw one "true" frame into the context
  function drawFrame(t) {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    letters.forEach(l => {
      // Each letter fades in with a staggered phase, then gently breathes
      const arrive = Math.min(1, Math.max(0, (t - l.ph * 0.6) / 1.4));
      const breathe = Math.sin(t * 0.6 + l.ph) * 0.012;

      // Slight vertical float per letter, staggered
      const floatY = 0;

      const alpha = arrive;

      if (alpha < 0.01) return;

      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.font = `${l.size}px ${FACE}`;
      ctx.fillStyle = '#ffffff';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      ctx.fillText(l.c, l.bx, l.by + floatY);
      ctx.restore();
    });
  }

  // Stepped + trail composite (posterize-time echo look)
  function renderLoop(timestamp) {
    globalT += 0.016; // ~60fps increment

    const stepInterval = 1000 / STEP_FPS;

    if (timestamp - lastStep >= stepInterval) {
      lastStep = timestamp;

      // Draw the "true" current frame into an offscreen canvas
      const offscreen = document.createElement('canvas');
      offscreen.width = W * dpr;
      offscreen.height = H * dpr;
      const octx = offscreen.getContext('2d');
      octx.scale(dpr, dpr);

      // Temporarily swap context, draw, swap back
      const origFont = ctx.font;
      drawFrameToCtx(octx, globalT);

      // Grab pixel snapshot
      const snap = octx.getImageData(0, 0, W * dpr, H * dpr);
      trail.push(snap);
      if (trail.length > TRAIL_FRAMES) trail.shift();

      // Composite: black fill first, then each trail frame at decreasing alpha
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, H);

      trail.forEach((frame, i) => {
        const age = trail.length - 1 - i; // 0 = newest
        // Older frames are fainter and slightly offset (echo / trace)
        const alpha = age === 0 ? 1.0 : Math.pow(0.45, age) * 0.7;
        const offX = age * 1.5; // slight rightward trace of older frames
        const offY = age * 0.4;

        // Draw the snapshot
        const tmp = document.createElement('canvas');
        tmp.width = W * dpr;
        tmp.height = H * dpr;
        const tctx = tmp.getContext('2d');
        tctx.putImageData(frame, 0, 0);

        ctx.save();
        ctx.globalAlpha = alpha;
        // Translate offset in device pixels
        ctx.drawImage(tmp, -offX * dpr, -offY * dpr, W + offX * 2, H + offY * 2);
        ctx.restore();
      });
    }

    raf = requestAnimationFrame(renderLoop);
  }

  // Vertical line blend — like an Illustrator stroke blend
  // Black lines on black bg: the negative space (gaps) is what reads.
  // Lines breathe: gap opens and closes slowly across the panel.
  function drawGrid(c, t) {
    const numLines = 260;
    const step = W / numLines;

    c.save();
    for (let i = 0; i < numLines; i++) {
      const x = i * step + step / 2;
      const wave = Math.sin(t * 0.5 - i * 0.08) * 0.55
                 + Math.sin(t * 0.18 + i * 0.03) * 0.35
                 + Math.sin(t * 0.09) * 0.1;
      // swings from near-invisible gap to near-solid
      const lw = step * (0.45 + wave * 0.55);

      c.strokeStyle = 'rgba(255,255,255,0.22)';
      c.lineWidth = Math.max(0.3, lw);
      c.beginPath();
      c.moveTo(x, 0);
      c.lineTo(x, H);
      c.stroke();
    }
    c.restore();
  }

  function drawFrameToCtx(c, t) {
    c.clearRect(0, 0, W, H);
    c.fillStyle = '#000';
    c.fillRect(0, 0, W, H);

    drawGrid(c, t);

    letters.forEach((l, i) => {
      const arrive = Math.min(1, Math.max(0, (t - l.ph * 0.6) / 1.4));
      const floatY = 0;
      if (arrive < 0.01) return;

      // Kerning animation: each row expands/contracts as a whole.
      // A slow sine per row drives a global "tracking" value — all letters
      // in that row shift outward from the left anchor proportionally.
      // This makes the word stretch and compress like adjustable tracking.
      const rowPhase = [0, 1.1, 2.3][l.row] || 0;
      const trackingWave = Math.sin(t * 0.18 + rowPhase) * 0.6
                         + Math.sin(t * 0.07 + rowPhase * 0.5) * 0.4;
      // trackingWave oscillates ±1; map to 0.8–1.6× base spacing
      const trackingMult = 1.2 + trackingWave * 0.4;
      // nudge = how far this letter has moved from its base lx, given expanded tracking
      const kernNudge = l.idxInRow * l.charW * (trackingMult - 1.0) * 0.9;

      const rx = l.bx + kernNudge;
      const ry = l.by + floatY;

      // Sparse bloom: two sines multiplied → spikes above threshold independently per letter
      const blurSine = Math.sin(t * 0.6 + i * 1.37)
                     * Math.sin(t * 0.25 + i * 0.83);
      // threshold 0.45 → fires ~20% of the time per letter, rarely in unison
      const blurStrength = Math.max(0, blurSine - 0.45) / 0.55;

      // Flip: rotate 180° around the exact center of the glyph bounding box.
      // Normal glyph: top edge at (ry - ascent), bottom at ry.
      // Center: (rx + charW/2,  ry - ascent/2)
      // Rotating 180° around that point keeps the glyph in the same bounding
      // box — cap-top stays at same Y, baseline stays at same Y — so the
      // flipped letter sits perfectly on the row baseline.
      const flipPivotX = rx + l.charW / 2;
      const flipPivotY = ry - l.ascent / 2;

      const applyFlip = (ctx2) => {
        if (l.flip) {
          ctx2.translate(flipPivotX, flipPivotY);
          ctx2.rotate(Math.PI);
          ctx2.translate(-flipPivotX, -flipPivotY);
        }
      };

      if (blurStrength > 0.01) {
        const cx = rx + l.charW / 2;
        const cy = ry - l.ascent * 0.5;
        const layers = 8;

        for (let k = 1; k <= layers; k++) {
          const frac = k / layers;
          const scale = 1 + frac * blurStrength * 0.18;
          const blurPx = frac * blurStrength * l.size * 0.08;
          const ghostAlpha = arrive * blurStrength * (0.55 - frac * 0.48);
          if (ghostAlpha < 0.02) continue;

          c.save();
          c.globalAlpha = ghostAlpha;
          if (blurPx > 0.5) c.filter = `blur(${blurPx.toFixed(1)}px)`;
          c.font = `${l.size}px ${FACE}`;
          c.fillStyle = '#ffffff';
          c.textBaseline = 'alphabetic';
          c.textAlign = 'left';
          c.translate(cx, cy);
          c.scale(scale, scale);
          c.translate(-cx, -cy);
          applyFlip(c);
          c.fillText(l.c, rx, ry);
          c.restore();
        }
      }

      // Core letter
      const coreAlpha = arrive * (1 - blurStrength * 0.35);
      c.save();
      c.globalAlpha = Math.max(0, coreAlpha);
      c.font = `${l.size}px ${FACE}`;
      c.fillStyle = '#ffffff';
      c.textBaseline = 'alphabetic';
      c.textAlign = 'left';
      applyFlip(c);
      c.fillText(l.c, rx, ry);
      c.restore();
    });
  }

  function init() {
    setup();
    raf = requestAnimationFrame(renderLoop);
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(init);
  } else {
    setTimeout(init, 400);
  }

  window.addEventListener('resize', () => {
    cancelAnimationFrame(raf);
    setup();
    raf = requestAnimationFrame(renderLoop);
  });
})();
</script>

</body>
</html>
